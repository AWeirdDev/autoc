[package]
name = "autoc"
version = "0.1.0"
edition = "2024"

[features]
default = ["wasm"]
wasm = ["dep:serde_json", "dep:serde"]

[dependencies]
thiserror = "2.0.21"
libclang-sys = { path = "./crates/libclang-sys" }

# for wasm
serde_json = { version = "1.0.152", optional = true }
serde = { version = "1.0.229", optional = true, features = ["derive"] }

[[bin]]
name = "wasm"
required-features = ["wasm"]

[workspace]
members = [
    "crates/libclang-sys"
]
